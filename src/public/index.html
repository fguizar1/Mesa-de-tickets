<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesa de tickets</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f2937; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    main { padding: 24px; display: grid; gap: 24px; grid-template-columns: 1fr 1fr; max-width: 1200px; margin: auto; }
    section { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    #loginView { max-width: 380px; margin: 60px auto; }
    h2 { margin-top: 0; font-size: 18px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; margin: 8px 0 4px; color: #555; }
    input, select, textarea, button { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; width: auto; padding: 8px 14px; margin-top: 10px; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: #6b7280; }
    header button { margin: 0; }
    .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    tbody tr[data-id] { cursor: pointer; }
    tbody tr[data-id]:hover td { background: #f9fafb; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e5e7eb; }
    .alta, .critica { background: #fee2e2; color: #991b1b; }
    .media { background: #fef3c7; color: #92400e; }
    .abierto { background: #dbeafe; color: #1e40af; }
    .en_progreso { background: #fef3c7; color: #92400e; }
    .resuelto { background: #d1fae5; color: #065f46; }
    .cerrado { background: #e5e7eb; color: #374151; }
    .msg { padding: 10px; border-radius: 6px; margin-top: 12px; display: none; }
    .msg.ok { display: block; background: #d1fae5; color: #065f46; }
    .msg.error { display: block; background: #fee2e2; color: #991b1b; }
    .hidden { display: none !important; }
    .muted { color: #6b7280; font-size: 13px; }
    .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
    .pager button { margin: 0; }
    ul.history { list-style: none; padding: 0; font-size: 14px; }
    ul.history li { padding: 6px 0; border-bottom: 1px solid #eee; }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
      header { padding: 12px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { border-bottom: 1px solid #eee; padding: 6px 0; }
      td { border: none; padding: 3px 0; }
      td::before { content: attr(data-label) ": "; font-weight: 600; color: #555; }
    }
  </style>
</head>
<body>
  <!-- Inicio de sesión -->
  <section id="loginView">
    <h2>Mesa de tickets</h2>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" required autocomplete="username" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password" />
      <button id="loginBtn" type="submit">Iniciar sesión</button>
    </form>
    <div id="loginMsg" class="msg"></div>
  </section>

  <!-- Aplicación -->
  <div id="appView" class="hidden">
    <header>
      <strong>Mesa de tickets</strong>
      <div>
        <span id="whoami"></span>
        <button id="logoutBtn" class="secondary" style="margin-left:12px;">Cerrar sesión</button>
      </div>
    </header>

    <main>
      <section>
        <h2>Reportar un problema</h2>
        <form id="createForm">
          <label for="title">Título</label>
          <input id="title" required minlength="3" maxlength="120" />
          <label for="description">Descripción</label>
          <textarea id="description" rows="3" required maxlength="2000"></textarea>
          <label for="priority">Prioridad</label>
          <select id="priority">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select>
          <button id="createBtn" type="submit">Crear ticket</button>
        </form>
        <div id="createMsg" class="msg"></div>
      </section>

      <section>
        <h2>Filtros</h2>
        <div class="row">
          <div>
            <label for="fPriority">Prioridad</label>
            <select id="fPriority">
              <option value="">Todas</option>
              <option value="baja">Baja</option>
              <option value="media">Media</option>
              <option value="alta">Alta</option>
              <option value="critica">Crítica</option>
            </select>
          </div>
          <div>
            <label for="fStatus">Estado</label>
            <select id="fStatus">
              <option value="">Todos</option>
              <option value="abierto">Abierto</option>
              <option value="en_progreso">En progreso</option>
              <option value="resuelto">Resuelto</option>
              <option value="cerrado">Cerrado</option>
            </select>
          </div>
          <div class="admin-only">
            <label for="fAssignee">Responsable</label>
            <select id="fAssignee"><option value="">Todos</option></select>
          </div>
          <div>
            <label for="fSort">Ordenar por</label>
            <select id="fSort">
              <option value="created_at:desc">Más recientes</option>
              <option value="created_at:asc">Más antiguos</option>
              <option value="updated_at:desc">Actualizados recientemente</option>
              <option value="priority:desc">Prioridad (mayor primero)</option>
              <option value="priority:asc">Prioridad (menor primero)</option>
            </select>
          </div>
        </div>
        <button id="applyFilters">Aplicar filtros</button>
      </section>

      <section class="full">
        <h2>Tickets</h2>
        <table>
          <thead>
            <tr><th>#</th><th>Título</th><th>Prioridad</th><th>Estado</th><th>Responsable</th></tr>
          </thead>
          <tbody id="ticketsBody"></tbody>
        </table>
        <div class="pager">
          <button id="prevBtn" class="secondary">← Anterior</button>
          <span id="pageInfo" class="muted"></span>
          <button id="nextBtn" class="secondary">Siguiente →</button>
        </div>
        <div id="listMsg" class="msg"></div>
      </section>

      <section id="detail" class="full hidden">
        <h2 id="detailTitle"></h2>
        <p id="detailDescription"></p>
        <p>
          <span id="detailPriority" class="badge"></span>
          <span id="detailStatus" class="badge"></span>
          <span id="detailMeta" class="muted"></span>
        </p>

        <div id="adminActions" class="row admin-only">
          <div>
            <label for="assignSelect">Asignar responsable</label>
            <select id="assignSelect"></select>
          </div>
          <button id="assignBtn">Asignar</button>
          <div>
            <label for="statusSelect">Cambiar estado</label>
            <select id="statusSelect">
              <option value="en_progreso">En progreso</option>
              <option value="resuelto">Resuelto</option>
              <option value="cerrado">Cerrado</option>
            </select>
          </div>
          <button id="statusBtn">Cambiar estado</button>
        </div>
        <p id="closedNote" class="muted hidden">Este ticket está cerrado y ya no admite cambios.</p>
        <div id="detailMsg" class="msg"></div>

        <h3>Historial</h3>
        <ul id="history" class="history"></ul>
      </section>
    </main>
  </div>

  <script>
    const LABELS = {
      status: { abierto: "Abierto", en_progreso: "En progreso", resuelto: "Resuelto", cerrado: "Cerrado" },
      priority: { baja: "Baja", media: "Media", alta: "Alta", critica: "Crítica" },
    };
    const PAGE_SIZE = 10;

    const state = {
      token: sessionStorage.getItem("token"),
      user: JSON.parse(sessionStorage.getItem("user") || "null"),
      offset: 0,
      total: 0,
      selectedId: null,
    };

    const $ = (id) => document.getElementById(id);
    const isAdmin = () => state.user?.role === "admin";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function showMsg(id, text, type = "ok") {
      const el = $(id);
      el.textContent = text;
      el.className = `msg ${type}`;
      clearTimeout(el._timer);
      el._timer = setTimeout(() => (el.className = "msg"), 4000);
    }

    async function busy(button, label, fn) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = label;
      try { return await fn(); }
      finally { button.disabled = false; button.textContent = original; }
    }

    async function api(path, { method = "GET", body } = {}) {
      const headers = {};
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (body) headers["Content-Type"] = "application/json";

      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));

      if (res.status === 401 && state.token) {
        logout();
        throw new Error("Tu sesión expiró. Inicia sesión de nuevo.");
      }
      if (!res.ok) {
        const detail = data.details?.map((d) => d.message).join(", ");
        throw new Error((data.error || "Error inesperado") + (detail ? `: ${detail}` : ""));
      }
      return data;
    }

    /* ---------- Sesión ---------- */
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await busy($("loginBtn"), "Entrando…", async () => {
          const { token, user } = await api("/api/auth/login", {
            method: "POST",
            body: { email: $("email").value, password: $("password").value },
          });
          state.token = token;
          state.user = user;
          sessionStorage.setItem("token", token);
          sessionStorage.setItem("user", JSON.stringify(user));
        });
        $("password").value = "";
        await startApp();
      } catch (err) {
        showMsg("loginMsg", err.message, "error");
      }
    });

    function logout() {
      sessionStorage.clear();
      state.token = null;
      state.user = null;
      state.selectedId = null;
      state.offset = 0;
      $("detail").classList.add("hidden");
      $("appView").classList.add("hidden");
      $("loginView").classList.remove("hidden");
    }
    $("logoutBtn").addEventListener("click", logout);

    async function startApp() {
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("whoami").textContent = `${state.user.name} (${isAdmin() ? "administrador" : "usuario"})`;
      document.querySelectorAll(".admin-only").forEach((el) =>
        el.classList.toggle("hidden", !isAdmin()));

      if (isAdmin()) {
        try {
          const users = await api("/api/users");
          const admins = users.filter((u) => u.role === "admin");
          const options = admins.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
          $("assignSelect").innerHTML = options;
          $("fAssignee").innerHTML = `<option value="">Todos</option>${options}`;
        } catch (err) {
          showMsg("listMsg", err.message, "error");
        }
      }
      await loadTickets();
    }

    /* ---------- Lista ---------- */
    async function loadTickets() {
      const params = new URLSearchParams({ limit: PAGE_SIZE, offset: state.offset });
      if ($("fPriority").value) params.set("priority", $("fPriority").value);
      if ($("fStatus").value) params.set("status", $("fStatus").value);
      if (isAdmin() && $("fAssignee").value) params.set("assigneeId", $("fAssignee").value);
      const [sortBy, order] = $("fSort").value.split(":");
      params.set("sortBy", sortBy);
      params.set("order", order);

      $("ticketsBody").innerHTML = `<tr><td colspan="5" class="muted">Cargando…</td></tr>`;
      try {
        const { data, total } = await api(`/api/tickets?${params}`);
        state.total = total;
        $("ticketsBody").innerHTML = data.map((t) => `
          <tr data-id="${t.id}">
            <td data-label="#">${t.id}</td>
            <td data-label="Título">${esc(t.title)}</td>
            <td data-label="Prioridad"><span class="badge ${t.priority}">${LABELS.priority[t.priority]}</span></td>
            <td data-label="Estado"><span class="badge ${t.status}">${LABELS.status[t.status]}</span></td>
            <td data-label="Responsable">${t.assignee_name ? esc(t.assignee_name) : "—"}</td>
          </tr>`).join("") || `<tr><td colspan="5" class="muted">Sin tickets</td></tr>`;

        const from = total ? state.offset + 1 : 0;
        $("pageInfo").textContent = `${from}–${Math.min(state.offset + PAGE_SIZE, total)} de ${total}`;
        $("prevBtn").disabled = state.offset === 0;
        $("nextBtn").disabled = state.offset + PAGE_SIZE >= total;
      } catch (err) {
        $("ticketsBody").innerHTML = "";
        showMsg("listMsg", err.message, "error");
      }
    }

    $("ticketsBody").addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-id]");
      if (row) selectTicket(Number(row.dataset.id));
    });
    $("applyFilters").addEventListener("click", () => { state.offset = 0; loadTickets(); });
    $("prevBtn").addEventListener("click", () => { state.offset = Math.max(0, state.offset - PAGE_SIZE); loadTickets(); });
    $("nextBtn").addEventListener("click", () => { state.offset += PAGE_SIZE; loadTickets(); });

    /* ---------- Detalle ---------- */
    async function selectTicket(id) {
      state.selectedId = id;
      $("detail").classList.remove("hidden");
      try {
        const [t, history] = await Promise.all([
          api(`/api/tickets/${id}`),
          api(`/api/tickets/${id}/history`),
        ]);
        $("detailTitle").textContent = `#${t.id} ${t.title}`;
        $("detailDescription").textContent = t.description;
        $("detailPriority").textContent = LABELS.priority[t.priority];
        $("detailPriority").className = `badge ${t.priority}`;
        $("detailStatus").textContent = LABELS.status[t.status];
        $("detailStatus").className = `badge ${t.status}`;
        $("detailMeta").textContent =
          `Reportado por ${t.reporter_name} · Responsable: ${t.assignee_name ?? "sin asignar"}`;

        const closed = t.status === "cerrado";
        $("closedNote").classList.toggle("hidden", !closed);
        $("assignBtn").disabled = closed;
        $("statusBtn").disabled = closed;
        if (t.assignee_id) $("assignSelect").value = String(t.assignee_id);

        $("history").innerHTML = history.map((h) => {
          const isAssign = h.field === "assignee_id";
          const before = isAssign ? (h.old_name ?? "sin responsable") : LABELS.status[h.old_value];
          const after = isAssign ? h.new_name : LABELS.status[h.new_value];
          return `<li>${new Date(h.changed_at).toLocaleString()} · <strong>${esc(h.actor)}</strong>
            cambió ${isAssign ? "el responsable" : "el estado"}: ${esc(before)} → ${esc(after)}</li>`;
        }).join("") || "<li class='muted'>Sin cambios todavía</li>";

        $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (err) {
        $("detail").classList.add("hidden");
        showMsg("listMsg", err.message, "error");
      }
    }

    async function refreshAfterChange(okText) {
      showMsg("detailMsg", okText, "ok");
      await Promise.all([loadTickets(), selectTicket(state.selectedId)]);
    }

    $("assignBtn").addEventListener("click", () =>
      busy($("assignBtn"), "Asignando…", async () => {
        try {
          await api(`/api/tickets/${state.selectedId}/assign`, {
            method: "PATCH",
            body: { assigneeId: Number($("assignSelect").value) },
          });
          await refreshAfterChange("Responsable asignado");
        } catch (err) { showMsg("detailMsg", err.message, "error"); }
      }));

    $("statusBtn").addEventListener("click", () => {
      const status = $("statusSelect").value;
      if (status === "cerrado" && !confirm("¿Cerrar este ticket? Después ya no podrá modificarse.")) return;
      return busy($("statusBtn"), "Guardando…", async () => {
        try {
          await api(`/api/tickets/${state.selectedId}/status`, { method: "PATCH", body: { status } });
          await refreshAfterChange("Estado actualizado");
        } catch (err) { showMsg("detailMsg", err.message, "error"); }
      });
    });

    /* ---------- Crear ---------- */
    $("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await busy($("createBtn"), "Creando…", async () => {
          await api("/api/tickets", {
            method: "POST",
            body: {
              title: $("title").value,
              description: $("description").value,
              priority: $("priority").value,
            },
          });
        });
        e.target.reset();
        showMsg("createMsg", "Ticket creado", "ok");
        state.offset = 0;
        loadTickets();
      } catch (err) {
        showMsg("createMsg", err.message, "error");
      }
    });

    /* ---------- Inicio ---------- */
    if (state.token && state.user) startApp();
  </script>
</body>
</html>
